# SimpleDesign training: one key per TrainerArgs field (src/simpledesign/training/train.py)
# YAML floats need a dot: 1.0e-4, not 1e-4 (parsed as a string)

# model
esm_ck: checkpoints/esm2_t6_8M_UR50D
sigma: 1.0

# data
data_dir: data/afdb_100
afdb_tar: /n/netscratch/kempner_bsabatini_lab/Lab/tbush/data/afdb_swissprot/swissprot_pdb_v6.tar       # set to the SwissProt tar path to sample; not yet recorded in ../info.md
afdb_log: null       # existing JSON: replay; new path: save (default: data_dir/selection.json)
afdb_n: 100
afdb_min_plddt: 80.0
afdb_seed: 0         # independent of the training seed; existing log takes precedence
# Both afdb_tar and afdb_log null: load an already prepared data_dir.
max_len: 256
batch_size: 4       # proteins per GPU
n_replicas: 4       # views per protein -> model batch 16
num_workers: 0
cache: true

# optimization
num_steps: 50000
lr: 1.0e-4
weight_decay: 0.01
grad_clip: 1.0
lambda_seq: 1.0
lambda_struct: 1.0
seed: 0
fixed_corruption: false
translation_std: 0.0  # Angstrom

# internal joint-sampling evaluation (same model, not independent validation)
joint_eval_every: null  # null: off; also runs at the final step
joint_eval_length: 89
joint_eval_n_samples: 2
joint_eval_n_steps: 200  # per sampler: joint, inverse folding, folding
joint_eval_seed: 1234   # fixed probe randomness; training RNG state is restored

# logging / outputs
out_dir: runs/mps-20k
log_every: 1000
plot_history: true
plot_smooth: 20
plot_every: 1000      # null: off; velocity + sequence figures -> out_dir/viz (+ wandb)
viz_levels: [0.25, 0.5, 0.75]  # t = t' of each figure row
use_wandb: true
wandb_project: simpledesign
wandb_name: mps-20k

# checkpoints
ckpt_dir: runs/mps-20k/ckpt        # e.g. runs/debug/ckpt
ckpt_every: 1000
ckpt_keep_all: false  # false: overwrite last.pt
resume_from: null     # e.g. runs/debug/ckpt/last.pt
