[project]
name = "simpledesign"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biotite>=1.7.1",
    "einops>=0.8.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab-vim>=4.1.4",
    "notebook>=7.6.3",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
